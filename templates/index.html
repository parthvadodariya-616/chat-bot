<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

  <!-- ✅ Updated hashed CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='b9a3c5.css') }}" />
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>

<body class="bg-black text-white h-full w-full" style='font-family: Inter, "Noto Sans", sans-serif;'>

  <div class="flex justify-center items-center h-screen p-0 m-0">
    <div class="relative w-full h-full max-w-none md:flex border border-gray-800 rounded-none overflow-hidden">

      <!-- Mobile Header -->
      <div class="md:hidden flex justify-between items-center p-2 bg-black border-b border-gray-800 sticky top-0 z-20">
        <h1 class="text-white text-lg font-bold">AI Chat</h1>
        <button id="open-sidebar-button" class="p-2 rounded-md">
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <!-- Sidebar -->
      <div id="sidebar"
        class="fixed inset-y-0 left-0 bg-black w-80 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out z-30 border-r border-gray-800">
        <div class="flex h-full flex-col justify-between p-4">
          <div class="flex flex-col gap-4">
            <div class="flex justify-between items-center">
              <h1 class="text-white text-base font-medium">Chat Menu</h1>
              <button id="close-sidebar-button" class="md:hidden p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
                  viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd"
                    d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
                </svg>
              </button>
            </div>
            <div class="flex flex-col gap-2">
              <button id="new-chat-button"
                class="flex items-center gap-3 px-3 py-2 rounded-lg bg-gray-900 hover:bg-gray-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px"
                  fill="currentColor" viewBox="0 0 256 256">
                  <path
                    d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM184,136H136v48a8,8,0,0,1-16,0V136H72a8,8,0,0,1,0-16h48V72a8,8,0,0,1,16,0v48h48a8,8,0,0,1,0,16Z">
                  </path>
                </svg>
                <p class="text-sm font-medium text-white">New Chat</p>
              </button>
              <div class="border-t border-gray-800 my-2"></div>
              <div class="flex items-center gap-3 px-3 py-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px"
                  fill="currentColor" viewBox="0 0 256 256">
                  <path
                    d="M136,80v43.47l36.12,21.67a8,8,0,0,1-8.24,13.72l-40-24A8,8,0,0,1,120,128V80a8,8,0,0,1,16,0Zm-8-48A95.44,95.44,0,0,0,60.08,60.15C52.81,67.51,46.35,74.59,40,82V64a8,8,0,0,0-16,0v40a8,8,0,0,0,8,8H72a8,8,0,0,0,0-16H49c7.15-8.42,14.27-16.35,22.39-24.57a80,80,0,1,1,1.66,114.75,8,8,0,1,0-11,11.64A96,96,0,1,0,128,32Z">
                  </path>
                </svg>
                <p class="text-sm font-medium text-white">History</p>
              </div>
              <div id="history-list" class="flex flex-col gap-1 custom-scrollbar overflow-y-auto"></div>
            </div>
          </div>
          <div class="border-t border-gray-800 pt-4 space-y-2">
            <a href="{{ url_for('profile') }}"
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-white hover:bg-gray-800 transition-colors">
              <div
                class="size-6 rounded-full bg-gray-700 flex items-center justify-center text-sm font-bold text-[#A3FF00]">
                {{ session.user_name[0] | upper }}
              </div>
              <span class="text-sm font-medium">{{ session.user_name }}</span>
            </a>
            <a href="{{ url_for('logout') }}"
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-white hover:bg-gray-800 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px"
                fill="currentColor" viewBox="0 0 256 256">
                <path
                  d="M112,24a8,8,0,0,1,8,8V120a8,8,0,0,1-16,0V32a8,8,0,0,1,8-8Zm88,64a8,8,0,0,0-8,8v88H72V96a8,8,0,0,0-16,0v96a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V96A8,8,0,0,0,200,88Z">
                </path>
              </svg>
              <span class="text-sm font-medium">Logout</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Main Chat Area -->
      <main class="flex-1 flex flex-col h-full bg-black">
        <div id="chat-header" class="flex items-center justify-between p-4 border-b border-gray-800">
          <h2 id="chat-title" class="text-lg font-semibold text-[#A3FF00] truncate">Welcome</h2>
        </div>

        <div id="welcome-screen" class="flex flex-col items-center justify-center flex-grow p-4 text-center">
          <h2 class="text-3xl font-bold text-white pb-3">AI Chat</h2>
          <p class="text-lg text-gray-400 pb-3">Start a new conversation or select one from your history.</p>
          <!-- ✅ Obfuscated image -->
          <img src="{{ url_for('static', filename='assets/images/xb91v.png') }}" alt="Robot assistant"
            class="w-full max-w-xs my-6">
        </div>

        <div id="chat-area" class="hidden flex-1 flex flex-col relative overflow-hidden">
          <div id="chat-container" class="flex-1 p-6 space-y-4 overflow-y-auto custom-scrollbar"></div>
          <div class="px-4 py-3 border-t border-gray-800">
            <form id="chat-form" class="flex items-center gap-3">
              <input id="message-input" placeholder="Type your message..."
                class="form-input flex-1 rounded-lg bg-gray-900 border-gray-700 text-white placeholder-gray-500 h-12 px-4"
                disabled />
              <button type="submit" id="send-button"
                class="flex items-center justify-center size-12 rounded-lg bg-[#A3FF00] text-black hover:bg-[#A3FF00]/80 disabled:opacity-50"
                disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor"
                  viewBox="0 0 256 256">
                  <path
                    d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z">
                  </path>
                </svg>
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ✅ Obfuscated script file -->
  <script src="{{ url_for('static', filename='script.obf.js') }}"></script>
</body>
</html>
