<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile - AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-black text-white" style='font-family: Inter, "Noto Sans", sans-serif;'>
    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="flex items-center justify-between whitespace-nowrap border-b border-gray-800 px-10 py-3">
            <div class="flex items-center gap-4">
                <h2 class="text-lg font-bold text-[#A3FF00]">Chatbot AI</h2>
            </div>
            <nav class="flex items-center gap-6 text-sm">
                <a href="{{ url_for('chat_index') }}" class="text-gray-300 hover:text-white">Chat</a>
                <a href="{{ url_for('profile') }}" class="text-white font-semibold">Profile</a>
                <a href="{{ url_for('logout') }}" class="text-gray-300 hover:text-white">Logout</a>
            </nav>
        </header>
        <!-- Main Content -->
        <main class="flex-grow flex justify-center items-center p-4">
            <div class="w-full max-w-4xl">
                <!-- User Info -->
                <div class="flex flex-col items-center gap-6 mb-8">
                    <div class="size-24 rounded-full bg-gray-700 flex items-center justify-center text-3xl font-bold text-[#A3FF00]">
                        {{ user.name[0] | upper }}
                    </div>
                    <div class="text-center">
                        <h1 class="text-3xl font-bold text-white">{{ user.name }}</h1>
                        <p class="text-lg text-gray-400">{{ user.email }}</p>
                    </div>
                </div>
                <!-- Chat History -->
                <h2 class="text-2xl font-bold text-white mb-4 text-center">Chat History</h2>
                <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-800">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Chat Title</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for chat in chats %}
                            <tr class="border-b border-gray-800">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-200">{{ chat.title }}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm">
                                    <a href="{{ url_for('chat_index') }}?session_id={{ chat.id }}" class="text-[#A3FF00] hover:underline">View</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-400">You have no chat history yet.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
